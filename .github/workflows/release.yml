name: Build Windows exe

# Publish a release either way:
#  - push a tag like v1.0.1, or
#  - Actions tab -> "Build Windows exe" -> Run workflow, and enter a tag.
# Run it with the tag left empty to only build a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, e.g. v1.0.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name FTV_Diagnostics_Filter ftv_diagnostics_filter.py

      - name: Smoke test the exe (CLI mode)
        shell: pwsh
        run: |
          # --windowed exes don't block the console, so wait explicitly
          Start-Process -Wait -FilePath dist\FTV_Diagnostics_Filter.exe `
            -ArgumentList 'samples\sample_export.xml','-c','DataLog','-x','Off','-o','smoke.csv'
          if (-not (Test-Path smoke.csv)) { throw "exe produced no CSV" }
          $rows = (Import-Csv smoke.csv | Measure-Object).Count
          if ($rows -ne 2) { throw "expected 2 rows, got $rows" }
          "Smoke test OK: $rows rows"

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\FTV_Diagnostics_Filter.exe -Algorithm SHA256).Hash
          "$h  FTV_Diagnostics_Filter.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: FTV_Diagnostics_Filter
          path: |
            dist/FTV_Diagnostics_Filter.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:TAG_INPUT.Trim() }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got '$tag'" }
          $files = 'dist\FTV_Diagnostics_Filter.exe', 'dist\SHA256SUMS.txt'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # release already exists (e.g. created on the web): replace its files
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --target $env:GITHUB_SHA `
              --title "FTV Diagnostics Filter $tag" `
              --notes "Windows build. Download FTV_Diagnostics_Filter.exe and run it - no Python needed. The exe is unsigned, so Windows SmartScreen may warn on first launch (More info -> Run anyway). Verify the download against SHA256SUMS.txt."
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed" }
