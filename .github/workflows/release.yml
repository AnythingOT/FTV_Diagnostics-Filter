name: Build Windows exe

# Push a tag like v1.0.1 to build the exe and publish it as a GitHub Release.
# "Run workflow" (manual) builds it as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name FT_Diagnostic_Filter ft_diagnostic_filter.py

      - name: Smoke test the exe (CLI mode)
        shell: pwsh
        run: |
          # --windowed exes don't block the console, so wait explicitly
          Start-Process -Wait -FilePath dist\FT_Diagnostic_Filter.exe `
            -ArgumentList 'samples\sample_export.xml','-c','DataLog','-x','Off','-o','smoke.csv'
          if (-not (Test-Path smoke.csv)) { throw "exe produced no CSV" }
          $rows = (Import-Csv smoke.csv | Measure-Object).Count
          if ($rows -ne 2) { throw "expected 2 rows, got $rows" }
          "Smoke test OK: $rows rows"

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\FT_Diagnostic_Filter.exe -Algorithm SHA256).Hash
          "$h  FT_Diagnostic_Filter.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: FT_Diagnostic_Filter
          path: |
            dist/FT_Diagnostic_Filter.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            dist\FT_Diagnostic_Filter.exe dist\SHA256SUMS.txt `
            --title "FT Diagnostic Filter ${{ github.ref_name }}" `
            --notes "Windows build. Download FT_Diagnostic_Filter.exe and run it - no Python needed. The exe is unsigned, so Windows SmartScreen may warn on first launch (More info -> Run anyway). Verify the download against SHA256SUMS.txt."
